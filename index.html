<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Proof Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 환경변수 설정 파일 로드 -->
  <script src="./config.js"></script>
</head>
<body class="bg-gray-100 p-4 max-w-md mx-auto">
  <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
    <h2 class="text-xl font-bold text-gray-800 border-b pb-2">SOL QA Proof Upload</h2>
    
    <!-- Profile Section -->
    <div class="space-y-3 bg-blue-50 p-3 rounded-lg">
      <p class="text-xs font-semibold text-blue-600">👤 User Profile</p>

      <!-- 🔥 자동 생성되는 즐겨찾기 칩 목록 영역 -->
      <div id="savedProfilesSection" class="hidden">
        <label class="text-[11px] font-bold text-gray-500">Quick Switch (Saved Profiles):</label>
        <div id="profileChips" class="flex flex-wrap gap-1.5 mt-1">
          <!-- Dynamic Chips injected here -->
        </div>
      </div>

      <!-- Tester Name 입력란 -->
      <div>
        <label class="text-xs text-gray-600 font-bold">Tester Name * <span class="text-gray-400 font-normal">(Nama Tester)</span></label>
        <input type="text" id="testerName" placeholder="e.g. Alex" class="w-full p-2 border rounded text-sm bg-white font-bold text-indigo-800 mt-0.5">
      </div>

      <div>
        <label class="text-xs text-gray-600">Department <span class="text-gray-400">(Departemen)</span></label>
        <select id="department" class="w-full p-2 border rounded text-sm bg-white">
          <option value="E-banking">E-banking</option>
          <option value="OCI">OCI</option>
          <option value="Retail">Retail</option>
          <option value="INTERNATIONAL">INTERNATIONAL</option>
          <option value="Cyber">Cyber</option>
          <option value="SPD">SPD</option>
          <option value="IT">IT</option>
          <option value="etc">etc</option>
        </select>
      </div>

      <div class="flex gap-2">
        <div class="w-1/2">
          <label class="text-xs text-gray-600">Employee ID <span class="text-gray-400">(NIP)</span></label>
          <input 
            type="tel" 
            inputmode="numeric" 
            pattern="[0-9]*" 
            id="employeeId" 
            placeholder="e.g. 21100306" 
            oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
            class="w-full p-2 border rounded text-sm font-mono"
          >
        </div>
        <div class="w-1/2">
          <label class="text-xs text-gray-600">SOL USER ID</label>
          <input type="text" id="solUserId" placeholder="e.g. IDSOLTEST103" class="w-full p-2 border rounded text-sm">
        </div>
      </div>

      <!-- Case ID Base Section -->
      <div>
        <label class="text-xs font-bold text-indigo-700">Case ID Base * <span class="text-gray-400 font-normal">(Prefix)</span></label>
        <input 
          type="text" 
          id="caseIdBase" 
          placeholder="e.g. ID_IQ_300_01" 
          oninput="autoFormatCaseIdBase(this)"
          class="w-full p-2 border-2 border-indigo-400 rounded text-sm uppercase font-mono tracking-wide bg-white transition-colors"
        >
        <p id="caseIdErrorMsg" class="text-[11px] font-semibold text-red-600 mt-1 hidden"></p>
        
        <p class="text-[10px] text-gray-500 mt-1">
          * Enter letters & numbers only. Underscores (_) are added automatically.<br>
          <span class="text-gray-400">(Ketik huruf & angka saja. Garis bawah (_) akan ditambahkan otomatis.)</span>
        </p>
      </div>
    </div>

    <!-- Dynamic Test Cases Container -->
    <div class="space-y-4">
      <div class="flex justify-between items-center border-b pb-1">
        <h3 class="text-sm font-bold text-gray-700">Test Cases <span class="text-xs text-gray-400">(Max 20)</span></h3>
        <button type="button" onclick="addTestCase()" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-bold px-3 py-1 rounded-lg text-xs border border-indigo-200 transition">
          + Add Case <span class="font-normal">(Tambah)</span>
        </button>
      </div>

      <div id="testCasesContainer" class="space-y-4">
        <!-- Dynamic TC Items -->
      </div>
    </div>

    <button id="submitBtn" onclick="handleSubmitAll()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg shadow hover:bg-indigo-700 disabled:bg-gray-300 disabled:text-gray-500 disabled:cursor-not-allowed transition mt-4">
      Submit All Cases <span class="font-normal text-xs">(Kirim Semua)</span>
    </button>
    <p id="statusMsg" class="text-center text-xs mt-2 font-semibold"></p>
  </div>

  <script>
    const GAS_WEB_APP_URL = window.ENV && window.ENV.GAS_WEB_APP_URL ? window.ENV.GAS_WEB_APP_URL : "";
    
    let tcCount = 0;
    const MAX_TC = 20;

    window.onload = () => {
      renderSavedProfileChips();
      
      // 마지막 활성 프로필 복원
      const last = JSON.parse(localStorage.getItem('qa_last_active_profile') || '{}');
      if (last.name) {
        applyProfileToForm(last);
      } else {
        validateCaseIdBase();
      }
      
      addTestCase();
    };

    // 🔥 LocalStorage 즐겨찾기 프로필 관리
    function getSavedProfiles() {
      try {
        return JSON.parse(localStorage.getItem('qa_quick_profiles')) || [];
      } catch (e) {
        return [];
      }
    }

    function saveCurrentProfileToQuickList() {
      const name = document.getElementById('testerName').value.trim();
      if (!name) return;

      const profile = {
        name: name,
        dept: document.getElementById('department').value,
        empId: document.getElementById('employeeId').value,
        solId: document.getElementById('solUserId').value,
        caseBase: document.getElementById('caseIdBase').value
      };

      let profiles = getSavedProfiles();
      // 기존 동일 이름 프로필 업데이트 또는 추가
      const idx = profiles.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
      if (idx >= 0) {
        profiles[idx] = profile;
      } else {
        profiles.unshift(profile);
      }

      localStorage.setItem('qa_quick_profiles', JSON.stringify(profiles));
      localStorage.setItem('qa_last_active_profile', JSON.stringify(profile));
      renderSavedProfileChips();
    }

    function renderSavedProfileChips() {
      const profiles = getSavedProfiles();
      const container = document.getElementById('profileChips');
      const section = document.getElementById('savedProfilesSection');

      if (profiles.length === 0) {
        section.classList.add('hidden');
        return;
      }

      section.classList.remove('hidden');
      container.innerHTML = "";

      profiles.forEach((p, idx) => {
        const chip = document.createElement('div');
        chip.className = "inline-flex items-center gap-1 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 text-xs font-semibold px-2.5 py-1 rounded-full cursor-pointer transition";
        chip.innerHTML = `
          <span onclick="selectProfileChip(${idx})">👤 ${p.name}</span>
          <button onclick="deleteProfileChip(event, ${idx})" class="text-indigo-400 hover:text-red-500 font-bold ml-1">✕</button>
        `;
        container.appendChild(chip);
      });
    }

    function selectProfileChip(idx) {
      const profiles = getSavedProfiles();
      if (profiles[idx]) {
        applyProfileToForm(profiles[idx]);
        localStorage.setItem('qa_last_active_profile', JSON.stringify(profiles[idx]));
      }
    }

    function applyProfileToForm(p) {
      document.getElementById('testerName').value = p.name || '';
      document.getElementById('department').value = p.dept || 'E-banking';
      document.getElementById('employeeId').value = p.empId || '';
      document.getElementById('solUserId').value = p.solId || '';
      
      const caseBaseInput = document.getElementById('caseIdBase');
      caseBaseInput.value = p.caseBase || '';
      autoFormatCaseIdBase(caseBaseInput);
    }

    function deleteProfileChip(e, idx) {
      e.stopPropagation();
      let profiles = getSavedProfiles();
      profiles.splice(idx, 1);
      localStorage.setItem('qa_quick_profiles', JSON.stringify(profiles));
      renderSavedProfileChips();
    }

    // 복붙 및 언더바 기입 호환 자동 마스킹
    function autoFormatCaseIdBase(input) {
      let raw = input.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      let formatted = "";
      
      if (raw.length > 0) formatted += raw.substring(0, 2);
      if (raw.length > 2) formatted += "_" + raw.substring(2, 4);
      if (raw.length > 4) formatted += "_" + raw.substring(4, 7);
      if (raw.length > 7) formatted += "_" + raw.substring(7, 9);
      if (raw.length > 9) formatted += "_" + raw.substring(9);

      input.value = formatted;
      validateCaseIdBase();
      updateAllFullCaseIds();
    }

    function validateCaseIdBase() {
      const input = document.getElementById('caseIdBase');
      const errMsg = document.getElementById('caseIdErrorMsg');
      const submitBtn = document.getElementById('submitBtn');
      const val = input.value.trim();

      const baseRegex = /^[A-Z0-9]{2}_[A-Z0-9]{2}_[A-Z0-9]{3}_[A-Z0-9]{2}$/;

      if (!val) {
        errMsg.innerText = "⚠️ Case ID Base is required. (e.g. ID_IQ_300_01)";
        errMsg.classList.remove('hidden');
        input.className = "w-full p-2 border-2 border-red-500 rounded text-sm uppercase font-mono tracking-wide bg-white";
        submitBtn.disabled = true;
        return false;
      }

      if (!baseRegex.test(val)) {
        errMsg.innerText = "⚠️ Invalid Case ID format! Required e.g. ID_IQ_300_01\n(Format belum lengkap/sesuai. Contoh: ID_IQ_300_01)";
        errMsg.classList.remove('hidden');
        input.className = "w-full p-2 border-2 border-red-500 rounded text-sm uppercase font-mono tracking-wide bg-white";
        submitBtn.disabled = true;
        return false;
      }

      errMsg.classList.add('hidden');
      input.className = "w-full p-2 border-2 border-green-500 rounded text-sm uppercase font-mono tracking-wide bg-white";
      submitBtn.disabled = false;
      return true;
    }

    function addTestCase() {
      const container = document.getElementById('testCasesContainer');
      const currentCards = container.getElementsByClassName('tc-card');
      
      if (currentCards.length >= MAX_TC) {
        alert(`Maximum ${MAX_TC} cases allowed.\n(Maksimal ${MAX_TC} case saja.)`);
        return;
      }

      tcCount++;
      const tcIndex = currentCards.length + 1;
      const tcSuffix = `TC${String(tcIndex).padStart(2, '0')}`;
      const baseVal = document.getElementById('caseIdBase').value.trim().toUpperCase();
      const fullCaseId = baseVal ? `${baseVal}_${tcSuffix}` : tcSuffix;

      const cardHtml = `
        <div class="tc-card border rounded-lg p-3 bg-gray-50 space-y-3 relative" data-tc-id="${tcCount}">
          <div class="flex justify-between items-center border-b pb-1">
            <span class="text-xs font-bold text-gray-500">Case #${tcIndex}</span>
            ${currentCards.length > 0 ? `
              <button type="button" onclick="removeTestCase(this)" class="text-xs text-red-500 hover:text-red-700 font-bold">
                ✕ Delete
              </button>
            ` : ''}
          </div>

          <div>
            <label class="text-xs font-bold text-gray-700">Case ID <span class="text-xs font-normal text-gray-400">(Auto Readonly)</span></label>
            <input type="text" class="full-case-id w-full p-2 border rounded text-sm bg-gray-200 font-mono font-bold text-indigo-800" value="${fullCaseId}" readonly>
          </div>

          <div>
            <label class="text-xs font-bold text-gray-700">Test Result</label>
            <select class="tc-result w-full p-2 border rounded text-sm bg-white" onchange="toggleCondField(this)">
              <option value="Pass">Pass</option>
              <option value="Fail">Fail</option>
              <option value="Improvement">Improvement</option>
            </select>
          </div>

          <div class="cond-fields space-y-2 hidden border-l-4 border-amber-400 pl-2 bg-amber-50 p-2 rounded-r">
            <div>
              <label class="text-xs font-bold text-amber-800">Situation <span class="text-amber-600 font-normal">(Situasi)</span></label>
              <textarea class="tc-situation w-full p-1.5 border rounded text-xs" rows="2" placeholder="Describe the problem..."></textarea>
            </div>
            <div>
              <label class="text-xs font-bold text-amber-800">Expected Result <span class="text-amber-600 font-normal">(Hasil Diharapkan)</span></label>
              <textarea class="tc-expected w-full p-1.5 border rounded text-xs" rows="2" placeholder="Describe expected behavior..."></textarea>
            </div>
          </div>

          <div>
            <label class="text-xs font-bold text-gray-700">Proof Image *</label>
            <input type="file" class="tc-file w-full text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:bg-indigo-50 file:text-indigo-700" accept="image/*">
          </div>
        </div>
      `;

      container.insertAdjacentHTML('beforeend', cardHtml);
      reindexTestCases();
    }

    function removeTestCase(btn) {
      const card = btn.closest('.tc-card');
      card.remove();
      reindexTestCases();
    }

    function updateAllFullCaseIds() {
      reindexTestCases();
    }

    function reindexTestCases() {
      const cards = document.querySelectorAll('.tc-card');
      const baseVal = document.getElementById('caseIdBase').value.trim().toUpperCase();

      cards.forEach((card, idx) => {
        const tcIndex = idx + 1;
        const tcSuffix = `TC${String(tcIndex).padStart(2, '0')}`;
        const fullCaseId = baseVal ? `${baseVal}_${tcSuffix}` : tcSuffix;
        
        card.querySelector('.full-case-id').value = fullCaseId;
        card.querySelector('span.text-gray-500').innerText = `Case #${tcIndex}`;
      });
    }

    function toggleCondField(select) {
      const condDiv = select.closest('.tc-card').querySelector('.cond-fields');
      if (select.value === 'Fail' || select.value === 'Improvement') {
        condDiv.classList.remove('hidden');
      } else {
        condDiv.classList.add('hidden');
        condDiv.querySelector('.tc-situation').value = '';
        condDiv.querySelector('.tc-expected').value = '';
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function handleSubmitAll() {
      const testerName = document.getElementById('testerName').value.trim();
      if (!testerName) {
        alert("Please enter Tester Name.\n(Mohon isi Nama Tester.)");
        document.getElementById('testerName').focus();
        return;
      }

      if (!validateCaseIdBase()) return;

      const caseBase = document.getElementById('caseIdBase').value.trim().toUpperCase();
      const statusMsg = document.getElementById('statusMsg');
      const btn = document.getElementById('submitBtn');

      if (!GAS_WEB_APP_URL) {
        alert("Configuration Error: GAS_WEB_APP_URL is not defined in config.js");
        return;
      }

      const cards = document.querySelectorAll('.tc-card');
      if (cards.length === 0) {
        alert("Please add at least one test case.");
        return;
      }

      for (let i = 0; i < cards.length; i++) {
        const fileInput = cards[i].querySelector('.tc-file');
        if (fileInput.files.length === 0) {
          alert(`Please attach proof image for Case #${i + 1}.\n(Mohon unggah gambar bukti untuk Case #${i + 1}.)`);
          return;
        }
      }

      btn.disabled = true;
      statusMsg.className = "text-center text-xs mt-2 font-semibold text-blue-600";

      const dept = document.getElementById('department').value;
      const empId = document.getElementById('employeeId').value;
      const solId = document.getElementById('solUserId').value;

      try {
        for (let i = 0; i < cards.length; i++) {
          const card = cards[i];
          const fullCaseId = card.querySelector('.full-case-id').value;
          const result = card.querySelector('.tc-result').value;
          const situation = card.querySelector('.tc-situation').value;
          const expected = card.querySelector('.tc-expected').value;
          const file = card.querySelector('.tc-file').files[0];

          statusMsg.innerText = `Uploading Case ${i + 1} of ${cards.length} (${fullCaseId})...`;

          const fileData = await fileToBase64(file);

          const payload = {
            department: dept,
            employeeId: empId,
            solUserId: solId,
            caseId: fullCaseId,
            testResult: result,
            situation: situation,
            expectedResult: expected,
            fileName: file.name,
            fileMimeType: file.type,
            fileData: fileData
          };

          await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        // 🔥 제출 성공 시 현재 입력 정보를 즐겨찾기 칩에 자동 추가/업데이트
        saveCurrentProfileToQuickList();

        statusMsg.className = "text-center text-xs mt-2 font-semibold text-green-600";
        statusMsg.innerText = `✅ All ${cards.length} cases submitted successfully!`;

        document.getElementById('testCasesContainer').innerHTML = "";
        tcCount = 0;
        addTestCase();

      } catch (err) {
        statusMsg.className = "text-center text-xs mt-2 font-semibold text-red-600";
        statusMsg.innerText = "❌ Upload Failed (Gagal): " + err.toString();
      } finally {
        validateCaseIdBase();
        btn.innerHTML = 'Submit All Cases <span class="font-normal text-xs">(Kirim Semua)</span>';
      }
    }
  </script>
</body>
</html>

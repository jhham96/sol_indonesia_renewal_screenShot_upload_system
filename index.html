<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Proof Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 max-w-md mx-auto">
  <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
    <h2 class="text-xl font-bold text-gray-800 border-b pb-2">SOL QA Proof Upload</h2>
    
    <div class="space-y-3 bg-blue-50 p-3 rounded-lg">
      <p class="text-xs font-semibold text-blue-600">👤 User Profile <span class="text-gray-500 font-normal">(Auto-saved / Disimpan otomatis)</span></p>
      <div>
        <label class="text-xs text-gray-600">Department <span class="text-gray-400">(Departemen)</span></label>
        <select id="department" class="w-full p-2 border rounded text-sm bg-white">
          <option value="E-banking">E-banking</option>
          <option value="OCI">OCI</option>
          <option value="Retail">Retail</option>
          <option value="INTERNATIONAL">INTERNATIONAL</option>
          <option value="Cyber">Cyber</option>
          <option value="SPD">SPD</option>
          <option value="IT">IT</option>
          <option value="etc">etc</option>
        </select>
      </div>
      <div class="flex gap-2">
        <div class="w-1/2">
          <label class="text-xs text-gray-600">Employee ID <span class="text-gray-400">(NIP)</span></label>
          <input type="text" id="employeeId" placeholder="e.g. 21100306" class="w-full p-2 border rounded text-sm">
        </div>
        <div class="w-1/2">
          <label class="text-xs text-gray-600">SOL USER ID</label>
          <input type="text" id="solUserId" placeholder="e.g. IDSOLTEST103" class="w-full p-2 border rounded text-sm">
        </div>
      </div>
    </div>

    <div class="space-y-3">
      <div>
        <label class="text-xs font-bold text-gray-700">Case ID * <span class="text-gray-400 font-normal">(ID Kasus)</span></label>
        <input 
          type="text" 
          id="caseId" 
          placeholder="e.g. ID_IQ_300_01_TC01" 
          oninput="sanitizeAndUppercaseCaseId(this)"
          class="w-full p-2 border-2 border-indigo-400 rounded text-sm uppercase font-mono tracking-wide"
        >
        <p class="text-[10px] text-gray-400 mt-1">* Format pattern required: ID_IQ_300_01_TC01</p>
      </div>

      <div>
        <label class="text-xs font-bold text-gray-700">Test Result <span class="text-gray-400 font-normal">(Hasil Tes)</span></label>
        <select id="testResult" onchange="toggleConditionalFields()" class="w-full p-2 border rounded text-sm">
          <option value="Pass">Pass</option>
          <option value="Fail">Fail</option>
          <option value="Improvement">Improvement</option>
        </select>
      </div>

      <div id="conditionalFields" class="space-y-3 hidden border-l-4 border-amber-400 pl-3 py-1 bg-amber-50 rounded-r">
        <div>
          <label class="text-xs font-bold text-amber-800">Situation <span class="text-amber-600 font-normal">(Deskripsi Masalah / Situasi)</span></label>
          <textarea id="situation" rows="2" placeholder="Describe the problem encountered / Jelaskan masalah yang terjadi" class="w-full p-2 border rounded text-sm"></textarea>
        </div>
        <div>
          <label class="text-xs font-bold text-amber-800">Expected Result <span class="text-amber-600 font-normal">(Hasil yang Diharapkan)</span></label>
          <textarea id="expectedResult" rows="2" placeholder="Describe expected behavior / Hasil yang seharusnya" class="w-full p-2 border rounded text-sm"></textarea>
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-gray-700">Test Proof Image * <span class="text-gray-400 font-normal">(Bukti Gambar)</span></label>
        <input type="file" id="proofFile" accept="image/*" class="w-full text-xs text-gray-500 file:mr-2 file:py-2 file:px-4 file:rounded file:border-0 file:bg-indigo-50 file:text-indigo-700">
      </div>
    </div>

    <button id="submitBtn" onclick="handleSubmit()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg shadow hover:bg-indigo-700 active:scale-95 transition">
      Submit & Next <span class="font-normal text-xs">(Kirim & Lanjut)</span>
    </button>
    <p id="statusMsg" class="text-center text-xs mt-2 font-semibold"></p>
  </div>

  <script>
    // ⚠️ 1단계에서 배포한 Google Apps Script Web App URL 입력
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzkkAglI4rdZjDOSItl9zSw90AbkgJRmlErVsgSO1iZ4j7qngGSXSeVI2p4I9sMe54caw/exec";

    window.onload = () => {
      if (localStorage.getItem('qa_dept')) document.getElementById('department').value = localStorage.getItem('qa_dept');
      if (localStorage.getItem('qa_empId')) document.getElementById('employeeId').value = localStorage.getItem('qa_empId');
      if (localStorage.getItem('qa_solId')) document.getElementById('solUserId').value = localStorage.getItem('qa_solId');
      toggleConditionalFields();
    };

    ['department', 'employeeId', 'solUserId'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => {
        localStorage.setItem('qa_dept', document.getElementById('department').value);
        localStorage.setItem('qa_empId', document.getElementById('employeeId').value);
        localStorage.setItem('qa_solId', document.getElementById('solUserId').value);
      });
    });

    // Real-time input sanitizer (uppercase & allow letters, numbers, underscores)
    function sanitizeAndUppercaseCaseId(input) {
      input.value = input.value.replace(/[^a-zA-Z0-9_]/g, '').toUpperCase();
    }

    // Strict pattern validation for format like ID_IQ_300_01_TC01
    function validateCaseIdFormat(caseId) {
      const caseIdRegex = /^[A-Z0-9]+(_[A-Z0-9]+)+$/;
      return caseIdRegex.test(caseId);
    }

    function toggleConditionalFields() {
      const result = document.getElementById('testResult').value;
      const condDiv = document.getElementById('conditionalFields');
      if (result === 'Fail' || result === 'Improvement') {
        condDiv.classList.remove('hidden');
      } else {
        condDiv.classList.add('hidden');
        document.getElementById('situation').value = "";
        document.getElementById('expectedResult').value = "";
      }
    }

    async function handleSubmit() {
      const caseIdInput = document.getElementById('caseId');
      const fileInput = document.getElementById('proofFile');
      const statusMsg = document.getElementById('statusMsg');
      const btn = document.getElementById('submitBtn');

      const formattedCaseId = caseIdInput.value.trim().toUpperCase();

      // Validate Case ID format
      if (!formattedCaseId || !validateCaseIdFormat(formattedCaseId)) {
        alert("Invalid Case ID format! (e.g. ID_IQ_300_01_TC01)\n\nFormat Case ID tidak valid! Gunakan format seperti ID_IQ_300_01_TC01.");
        caseIdInput.focus();
        return;
      }

      if (fileInput.files.length === 0) {
        alert("Please attach a proof image.\n(Mohon lampirkan bukti gambar.)");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Uploading... (Mengunggah...)";
      statusMsg.innerText = "";

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        const payload = {
          department: document.getElementById('department').value,
          employeeId: document.getElementById('employeeId').value,
          solUserId: document.getElementById('solUserId').value,
          caseId: formattedCaseId,
          testResult: document.getElementById('testResult').value,
          situation: document.getElementById('situation').value,
          expectedResult: document.getElementById('expectedResult').value,
          fileName: file.name,
          fileMimeType: file.type,
          fileData: e.target.result
        };

        try {
          await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          statusMsg.className = "text-center text-xs mt-2 font-semibold text-green-600";
          statusMsg.innerText = `✅ Submitted: ${formattedCaseId} (Berhasil dikirim!)`;

          // Clear variable inputs while keeping profile data
          caseIdInput.value = "";
          fileInput.value = "";
          document.getElementById('testResult').value = "Pass";
          toggleConditionalFields();
          caseIdInput.focus();

        } catch (err) {
          statusMsg.className = "text-center text-xs mt-2 font-semibold text-red-600";
          statusMsg.innerText = "❌ Upload Failed (Gagal): " + err.toString();
        } finally {
          btn.disabled = false;
          btn.innerHTML = 'Submit & Next <span class="font-normal text-xs">(Kirim & Lanjut)</span>';
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>

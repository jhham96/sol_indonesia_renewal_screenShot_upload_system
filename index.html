<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Proof Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./config.js"></script>
  <style>
    .preview-card { transition: all 0.25s ease-in-out; }
  </style>
</head>
<body class="bg-gray-100 p-4 max-w-md mx-auto relative min-h-screen">

  <!-- Fullscreen Loading Progress Modal -->
  <div id="loadingModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl text-center space-y-4">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
      
      <div>
        <h3 class="text-base font-bold text-gray-800">Uploading Test Proofs...</h3>
        <p class="text-xs text-gray-500 mt-0.5">Mohon tunggu, sedang mengunggah...</p>
      </div>

      <div class="bg-indigo-50 p-2.5 rounded-lg border border-indigo-100">
        <p id="modalStatusText" class="text-xs font-bold text-indigo-700 truncate">Preparing files...</p>
      </div>

      <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
        <div id="modalProgressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
      <p id="modalPercentText" class="text-[11px] font-bold text-gray-400">0%</p>
    </div>
  </div>

  <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
    <h2 class="text-xl font-bold text-gray-800 border-b pb-2">SOL QA Proof Upload</h2>
    
    <!-- Profile Section -->
    <div class="space-y-3 bg-blue-50 p-3 rounded-lg">
      <p class="text-xs font-semibold text-blue-600">👤 User Profile</p>

      <div id="savedProfilesSection" class="hidden">
        <label class="text-[11px] font-bold text-gray-500">Quick Switch (Saved Profiles):</label>
        <div id="profileChips" class="flex flex-wrap gap-1.5 mt-1"></div>
      </div>

      <!-- Tester Name -->
      <div>
        <label class="text-xs text-gray-600 font-bold">Tester Name * <span class="text-gray-400 font-normal">(Nama Tester)</span></label>
        <div class="relative mt-0.5">
          <input type="text" id="testerName" placeholder="e.g. Alex" oninput="toggleClearBtn(this)" class="w-full p-2 pr-7 border rounded text-sm bg-white font-bold text-indigo-800">
          <button type="button" onclick="clearInput('testerName')" class="clear-btn absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 font-bold text-xs hidden">✕</button>
        </div>
      </div>

      <!-- Department (선택 즉시 닫힘 처리) -->
      <div>
        <label class="text-xs text-gray-600">Department <span class="text-gray-400">(Departemen)</span></label>
        <select id="department" onchange="this.blur()" class="w-full p-2 border rounded text-sm bg-white">
          <option value="E-banking">E-banking</option>
          <option value="OCI">OCI</option>
          <option value="Retail">Retail</option>
          <option value="INTERNATIONAL">INTERNATIONAL</option>
          <option value="Cyber">Cyber</option>
          <option value="SPD">SPD</option>
          <option value="IT">IT</option>
          <option value="etc">etc</option>
        </select>
      </div>

      <div class="flex gap-2">
        <!-- Employee ID -->
        <div class="w-1/2">
          <label class="text-xs text-gray-600">Employee ID <span class="text-gray-400">(NIP)</span></label>
          <div class="relative mt-0.5">
            <input 
              type="tel" 
              inputmode="numeric" 
              pattern="[0-9]*" 
              id="employeeId" 
              placeholder="e.g. 21100306" 
              oninput="this.value = this.value.replace(/[^0-9]/g, ''); toggleClearBtn(this);" 
              class="w-full p-2 pr-7 border rounded text-sm font-mono"
            >
            <button type="button" onclick="clearInput('employeeId')" class="clear-btn absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 font-bold text-xs hidden">✕</button>
          </div>
        </div>
        <!-- SOL USER ID -->
        <div class="w-1/2">
          <label class="text-xs text-gray-600">SOL USER ID</label>
          <div class="relative mt-0.5">
            <input type="text" id="solUserId" placeholder="e.g. IDSOLTEST103" oninput="toggleClearBtn(this)" class="w-full p-2 pr-7 border rounded text-sm">
            <button type="button" onclick="clearInput('solUserId')" class="clear-btn absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 font-bold text-xs hidden">✕</button>
          </div>
        </div>
      </div>

      <!-- Case ID Base & Start TC Section -->
      <div class="flex gap-2">
        <div class="w-3/4">
          <label class="text-xs font-bold text-indigo-700">Case ID Base * <span class="text-gray-400 font-normal">(Prefix)</span></label>
          <div class="relative mt-0.5">
            <input 
              type="text" 
              id="caseIdBase" 
              placeholder="e.g. ID_IQ_300_01" 
              oninput="autoFormatCaseIdBase(this); toggleClearBtn(this);"
              class="w-full p-2 pr-7 border-2 border-indigo-400 rounded text-sm uppercase font-mono tracking-wide bg-white transition-colors"
            >
            <button type="button" onclick="clearInput('caseIdBase')" class="clear-btn absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 font-bold text-xs hidden">✕</button>
          </div>
        </div>
        <!-- Start TC (선택 즉시 닫힘 처리) -->
        <div class="w-1/4">
          <label class="text-xs font-bold text-indigo-700">Start TC</label>
          <select id="startTcSelect" onchange="updateAllFullCaseIds(); this.blur();" class="w-full p-2 border-2 border-indigo-400 rounded text-sm bg-white font-mono font-bold text-indigo-800 mt-0.5">
          </select>
        </div>
      </div>
      
      <p id="caseIdErrorMsg" class="text-[11px] font-semibold text-red-600 mt-1 hidden"></p>
      
      <p class="text-[10px] text-gray-500 mt-1">
        * Enter letters & numbers only. Underscores (_) are added automatically.<br>
        <span class="text-gray-400">(Ketik huruf & angka saja. Garis bawah (_) akan ditambahkan otomatis.)</span>
      </p>
    </div>

    <!-- Dynamic Test Cases Container -->
    <div class="space-y-4">
      <div class="flex justify-between items-center border-b pb-1">
        <h3 class="text-sm font-bold text-gray-700">Test Cases <span class="text-xs text-gray-400">(Max 20)</span></h3>
        <button type="button" onclick="addTestCase()" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-bold px-3 py-1 rounded-lg text-xs border border-indigo-200 transition">
          + Add Case <span class="font-normal">(Tambah)</span>
        </button>
      </div>

      <div id="testCasesContainer" class="space-y-4"></div>
    </div>

    <p id="globalErrorMsg" class="text-xs font-semibold text-red-600 text-center hidden mt-2"></p>

    <button id="submitBtn" onclick="handleSubmitAll()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg shadow hover:bg-indigo-700 disabled:bg-gray-300 disabled:text-gray-500 disabled:cursor-not-allowed transition mt-2">
      Submit All Cases <span class="font-normal text-xs">(Kirim Semua)</span>
    </button>
    <p id="statusMsg" class="text-center text-xs mt-2 font-semibold"></p>
  </div>

  <script>
    const GAS_WEB_APP_URL = window.ENV && window.ENV.GAS_WEB_APP_URL ? window.ENV.GAS_WEB_APP_URL : "";
    
    let tcCount = 0;
    const MAX_TC = 20;
    const tcFilesStore = {};

    window.onload = () => {
      initStartTcOptions();
      renderSavedProfileChips();
      
      const last = JSON.parse(localStorage.getItem('qa_last_active_profile') || '{}');
      if (last.name) {
        applyProfileToForm(last);
      } else {
        validateFormState();
      }
      
      addTestCase();
      checkInitialClearBtns();
    };

    function toggleClearBtn(input) {
      const clearBtn = input.parentElement.querySelector('.clear-btn');
      if (clearBtn) {
        if (input.value.length > 0) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }
      }
    }

    function clearInput(inputId) {
      const input = document.getElementById(inputId);
      if (input) {
        input.value = "";
        toggleClearBtn(input);
        input.focus();

        if (inputId === 'caseIdBase') {
          autoFormatCaseIdBase(input);
        } else {
          validateFormState();
        }
      }
    }

    function checkInitialClearBtns() {
      ['testerName', 'employeeId', 'solUserId', 'caseIdBase'].forEach(id => {
        const input = document.getElementById(id);
        if (input) toggleClearBtn(input);
      });
    }

    function initStartTcOptions() {
      const select = document.getElementById('startTcSelect');
      select.innerHTML = "";
      for (let i = 1; i <= 50; i++) {
        const option = document.createElement('option');
        const numStr = String(i).padStart(2, '0');
        option.value = i;
        option.innerText = `TC${numStr}`;
        select.appendChild(option);
      }
    }

    function getSavedProfiles() {
      try { return JSON.parse(localStorage.getItem('qa_quick_profiles')) || []; } 
      catch (e) { return []; }
    }

    function saveCurrentProfileToQuickList() {
      const name = document.getElementById('testerName').value.trim();
      if (!name) return;

      const profile = {
        name: name,
        dept: document.getElementById('department').value,
        empId: document.getElementById('employeeId').value,
        solId: document.getElementById('solUserId').value,
        caseBase: document.getElementById('caseIdBase').value,
        startTc: document.getElementById('startTcSelect').value
      };

      let profiles = getSavedProfiles();
      const idx = profiles.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
      if (idx >= 0) profiles[idx] = profile;
      else profiles.unshift(profile);

      localStorage.setItem('qa_quick_profiles', JSON.stringify(profiles));
      localStorage.setItem('qa_last_active_profile', JSON.stringify(profile));
      renderSavedProfileChips();
    }

    // 🔥 터치 영역 확대 & 삭제 Confirm 보완된 프로필 칩 렌더링
    function renderSavedProfileChips() {
      const profiles = getSavedProfiles();
      const container = document.getElementById('profileChips');
      const section = document.getElementById('savedProfilesSection');

      if (profiles.length === 0) {
        section.classList.add('hidden');
        return;
      }

      section.classList.remove('hidden');
      container.innerHTML = "";

      profiles.forEach((p, idx) => {
        const chip = document.createElement('div');
        chip.className = "inline-flex items-center bg-indigo-100 hover:bg-indigo-200 text-indigo-800 text-xs font-semibold rounded-full overflow-hidden shadow-sm transition";
        
        chip.innerHTML = `
          <button type="button" onclick="selectProfileChip(${idx})" class="px-3 py-1.5 flex items-center gap-1 hover:bg-indigo-200 transition">
            👤 ${p.name}
          </button>
          <button type="button" onclick="deleteProfileChip(event, ${idx}, '${p.name}')" class="px-2.5 py-1.5 text-indigo-400 hover:text-red-600 hover:bg-red-100 font-bold border-l border-indigo-200 transition" title="Delete Profile">
            ✕
          </button>
        `;
        container.appendChild(chip);
      });
    }

    function selectProfileChip(idx) {
      const profiles = getSavedProfiles();
      if (profiles[idx]) {
        applyProfileToForm(profiles[idx]);
        localStorage.setItem('qa_last_active_profile', JSON.stringify(profiles[idx]));
      }
    }

    function applyProfileToForm(p) {
      document.getElementById('testerName').value = p.name || '';
      document.getElementById('department').value = p.dept || 'E-banking';
      document.getElementById('employeeId').value = p.empId || '';
      document.getElementById('solUserId').value = p.solId || '';
      document.getElementById('startTcSelect').value = p.startTc || 1;
      
      const caseBaseInput = document.getElementById('caseIdBase');
      caseBaseInput.value = p.caseBase || '';
      
      autoFormatCaseIdBase(caseBaseInput);
      checkInitialClearBtns();
    }

    function deleteProfileChip(e, idx, profileName) {
      e.stopPropagation();
      if (confirm(`Are you sure you want to delete '${profileName}' profile?\n('${profileName}' 프로필을 삭제하시겠습니까?)`)) {
        let profiles = getSavedProfiles();
        profiles.splice(idx, 1);
        localStorage.setItem('qa_quick_profiles', JSON.stringify(profiles));
        renderSavedProfileChips();
      }
    }

    function autoFormatCaseIdBase(input) {
      let raw = input.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      let formatted = "";
      
      if (raw.length > 0) formatted += raw.substring(0, 2);
      if (raw.length > 2) formatted += "_" + raw.substring(2, 4);
      if (raw.length > 4) formatted += "_" + raw.substring(4, 7);
      if (raw.length > 7) formatted += "_" + raw.substring(7, 9);
      if (raw.length > 9) formatted += "_" + raw.substring(9);

      input.value = formatted;
      validateFormState();
      updateAllFullCaseIds();
    }

    function validateFormState() {
      const input = document.getElementById('caseIdBase');
      const caseIdErr = document.getElementById('caseIdErrorMsg');
      const globalErr = document.getElementById('globalErrorMsg');
      const submitBtn = document.getElementById('submitBtn');
      const val = input.value.trim();

      const baseRegex = /^[A-Z0-9]{2}_[A-Z0-9]{2}_[A-Z0-9]{3}_[A-Z0-9]{2}$/;

      caseIdErr.classList.add('hidden');
      globalErr.classList.add('hidden');

      if (!val) {
        caseIdErr.innerText = "⚠️ Case ID Base is required. (e.g. ID_IQ_300_01)";
        caseIdErr.classList.remove('hidden');
        input.className = "w-full p-2 pr-7 border-2 border-red-500 rounded text-sm uppercase font-mono tracking-wide bg-white";
        submitBtn.disabled = true;
        return false;
      }

      if (!baseRegex.test(val)) {
        caseIdErr.innerText = "⚠️ Invalid Case ID format! Required e.g. ID_IQ_300_01\n(Format belum lengkap/sesuai. Contoh: ID_IQ_300_01)";
        caseIdErr.classList.remove('hidden');
        input.className = "w-full p-2 pr-7 border-2 border-red-500 rounded text-sm uppercase font-mono tracking-wide bg-white";
        submitBtn.disabled = true;
        return false;
      }

      input.className = "w-full p-2 pr-7 border-2 border-green-500 rounded text-sm uppercase font-mono tracking-wide bg-white";

      const cards = document.querySelectorAll('.tc-card');

      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const tcId = card.getAttribute('data-tc-id');
        const fullCaseId = card.querySelector('.full-case-id').value;
        const result = card.querySelector('.tc-result').value;
        const situation = card.querySelector('.tc-situation').value.trim();
        const expected = card.querySelector('.tc-expected').value.trim();
        const files = tcFilesStore[tcId] || [];

        if (files.length === 0) {
          globalErr.innerText = `⚠️ ${fullCaseId} requires at least 1 proof image.`;
          globalErr.classList.remove('hidden');
          submitBtn.disabled = true;
          return false;
        }

        if (result === 'Fail' || result === 'Improvement') {
          if (!situation || !expected) {
            globalErr.innerText = `⚠️ ${fullCaseId} requires Situation & Expected Result for ${result}.`;
            globalErr.classList.remove('hidden');
            submitBtn.disabled = true;
            return false;
          }
        }
      }

      submitBtn.disabled = false;
      return true;
    }

    function addTestCase() {
      const container = document.getElementById('testCasesContainer');
      const currentCards = container.getElementsByClassName('tc-card');
      
      if (currentCards.length >= MAX_TC) {
        alert(`Maximum ${MAX_TC} cases allowed.\n(Maksimal ${MAX_TC} case saja.)`);
        return;
      }

      tcCount++;
      const currentTcId = tcCount;
      tcFilesStore[currentTcId] = [];

      const startTcNum = parseInt(document.getElementById('startTcSelect').value, 10) || 1;
      const tcIndex = startTcNum + currentCards.length;
      const tcSuffix = `TC${String(tcIndex).padStart(2, '0')}`;
      const baseVal = document.getElementById('caseIdBase').value.trim().toUpperCase();
      const fullCaseId = baseVal ? `${baseVal}_${tcSuffix}` : tcSuffix;

      const cardHtml = `
        <div class="tc-card border rounded-lg p-3 bg-gray-50 space-y-3 relative" data-tc-id="${currentTcId}">
          <div class="flex justify-between items-center border-b pb-1">
            <span class="text-xs font-bold text-gray-500 card-title-index">Case (TC${String(tcIndex).padStart(2, '0')})</span>
            ${currentCards.length > 0 ? `
              <button type="button" onclick="removeTestCase(this, ${currentTcId})" class="text-xs text-red-500 hover:text-red-700 font-bold">
                ✕ Delete Case
              </button>
            ` : ''}
          </div>

          <div>
            <label class="text-xs font-bold text-gray-700">Case ID <span class="text-xs font-normal text-gray-400">(Auto Readonly)</span></label>
            <input type="text" class="full-case-id w-full p-2 border rounded text-sm bg-gray-200 font-mono font-bold text-indigo-800" value="${fullCaseId}" readonly>
          </div>

          <!-- Test Result (선택 즉시 닫힘 처리) -->
          <div>
            <label class="text-xs font-bold text-gray-700">Test Result</label>
            <select class="tc-result w-full p-2 border rounded text-sm bg-white" onchange="toggleCondField(this); this.blur();">
              <option value="Pass">Pass</option>
              <option value="Fail">Fail</option>
              <option value="Improvement">Improvement</option>
            </select>
          </div>

          <div class="cond-fields space-y-2 hidden border-l-4 border-amber-400 pl-2 bg-amber-50 p-2 rounded-r">
            <div>
              <label class="text-xs font-bold text-amber-800">Situation * <span class="text-amber-600 font-normal">(Situasi)</span></label>
              <textarea class="tc-situation w-full p-1.5 border rounded text-xs" rows="2" placeholder="Describe the problem..." oninput="validateFormState()"></textarea>
            </div>
            <div>
              <label class="text-xs font-bold text-amber-800">Expected Result * <span class="text-amber-600 font-normal">(Hasil Diharapkan)</span></label>
              <textarea class="tc-expected w-full p-1.5 border rounded text-xs" rows="2" placeholder="Describe expected behavior..." oninput="validateFormState()"></textarea>
            </div>
          </div>

          <div>
            <label class="text-xs font-bold text-gray-700">Proof Images * <span class="text-gray-400 font-normal">(Multiple)</span></label>
            
            <div class="mt-1">
              <label class="inline-flex items-center gap-1.5 bg-indigo-50 border border-indigo-200 text-indigo-700 px-3 py-2 rounded-lg text-xs font-bold cursor-pointer hover:bg-indigo-100 active:scale-95 transition">
                <span>📷 + Add Images (Tambah Gambar)</span>
                <input 
                  type="file" 
                  multiple 
                  accept="image/*"
                  onchange="handleFilesSelect(event, ${currentTcId})"
                  class="hidden"
                >
              </label>
            </div>

            <div id="previewContainer_${currentTcId}" class="grid grid-cols-3 gap-2 mt-2"></div>
          </div>
        </div>
      `;

      container.insertAdjacentHTML('beforeend', cardHtml);
      reindexTestCases();
      validateFormState();
    }

    function removeTestCase(btn, tcId) {
      const card = btn.closest('.tc-card');
      card.remove();
      delete tcFilesStore[tcId];
      reindexTestCases();
      validateFormState();
    }

    function updateAllFullCaseIds() {
      reindexTestCases();
      validateFormState();
    }

    function reindexTestCases() {
      const cards = document.querySelectorAll('.tc-card');
      const baseVal = document.getElementById('caseIdBase').value.trim().toUpperCase();
      const startTcNum = parseInt(document.getElementById('startTcSelect').value, 10) || 1;

      cards.forEach((card, idx) => {
        const tcIndex = startTcNum + idx;
        const tcSuffix = `TC${String(tcIndex).padStart(2, '0')}`;
        const fullCaseId = baseVal ? `${baseVal}_${tcSuffix}` : tcSuffix;
        
        card.querySelector('.full-case-id').value = fullCaseId;
        card.querySelector('.card-title-index').innerText = `Case (TC${String(tcIndex).padStart(2, '0')})`;
      });
    }

    function handleFilesSelect(e, tcId) {
      const newFiles = Array.from(e.target.files);
      if (newFiles.length === 0) return;

      if (!tcFilesStore[tcId]) tcFilesStore[tcId] = [];
      tcFilesStore[tcId] = tcFilesStore[tcId].concat(newFiles);
      
      e.target.value = "";
      renderFilePreviews(tcId);
      validateFormState();
    }

    function renderFilePreviews(tcId) {
      const container = document.getElementById(`previewContainer_${tcId}`);
      const files = tcFilesStore[tcId] || [];
      container.innerHTML = "";

      files.forEach((file, index) => {
        const reader = new FileReader();
        const wrapper = document.createElement('div');
        wrapper.className = "preview-card relative border rounded p-1 bg-white shadow-sm flex flex-col items-center transform transition-all duration-300";

        reader.onload = (e) => {
          wrapper.innerHTML = `
            <img src="${e.target.result}" class="w-full h-16 object-cover rounded mb-1">
            <span class="text-[9px] font-bold text-gray-500 truncate w-full text-center">#${index + 1}</span>
            <button type="button" onclick="removeSingleFile(${tcId}, ${index})" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] font-bold shadow hover:bg-red-700 transition">
              ✕
            </button>
            <div class="flex gap-1 w-full justify-between mt-1 px-0.5">
              <button type="button" onclick="moveFileOrder(${tcId}, ${index}, -1)" ${index === 0 ? 'disabled class="opacity-20"' : 'class="text-[10px] font-bold bg-gray-100 px-1.5 py-0.5 rounded hover:bg-indigo-100 active:scale-90 transition"'}>◀</button>
              <button type="button" onclick="moveFileOrder(${tcId}, ${index}, 1)" ${index === files.length - 1 ? 'disabled class="opacity-20"' : 'class="text-[10px] font-bold bg-gray-100 px-1.5 py-0.5 rounded hover:bg-indigo-100 active:scale-90 transition"'}>▶</button>
            </div>
          `;
        };
        reader.readAsDataURL(file);
        container.appendChild(wrapper);
      });
    }

    function removeSingleFile(tcId, index) {
      if (tcFilesStore[tcId]) {
        tcFilesStore[tcId].splice(index, 1);
        renderFilePreviews(tcId);
        validateFormState();
      }
    }

    function moveFileOrder(tcId, index, direction) {
      const files = tcFilesStore[tcId];
      if (!files) return;

      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= files.length) return;

      const container = document.getElementById(`previewContainer_${tcId}`);
      const cards = container.children;

      if (cards[index] && cards[newIndex]) {
        cards[index].classList.add('scale-90', 'opacity-50');
        cards[newIndex].classList.add('scale-90', 'opacity-50');

        setTimeout(() => {
          const temp = files[index];
          files[index] = files[newIndex];
          files[newIndex] = temp;
          renderFilePreviews(tcId);
        }, 150);
      }
    }

    function toggleCondField(select) {
      const condDiv = select.closest('.tc-card').querySelector('.cond-fields');
      if (select.value === 'Fail' || select.value === 'Improvement') {
        condDiv.classList.remove('hidden');
      } else {
        condDiv.classList.add('hidden');
        condDiv.querySelector('.tc-situation').value = '';
        condDiv.querySelector('.tc-expected').value = '';
      }
      validateFormState();
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    function showLoadingModal(statusText, progressPercent) {
      const modal = document.getElementById('loadingModal');
      const text = document.getElementById('modalStatusText');
      const bar = document.getElementById('modalProgressBar');
      const percent = document.getElementById('modalPercentText');

      modal.classList.remove('hidden');
      text.innerText = statusText;
      bar.style.width = `${progressPercent}%`;
      percent.innerText = `${Math.round(progressPercent)}%`;
    }

    function hideLoadingModal() {
      document.getElementById('loadingModal').classList.add('hidden');
    }

    async function handleSubmitAll() {
      const testerName = document.getElementById('testerName').value.trim();
      if (!testerName) {
        alert("Please enter Tester Name.\n(Mohon isi Nama Tester.)");
        document.getElementById('testerName').focus();
        return;
      }

      if (!validateFormState()) return;

      const caseBase = document.getElementById('caseIdBase').value.trim().toUpperCase();
      const statusMsg = document.getElementById('statusMsg');
      const btn = document.getElementById('submitBtn');

      if (!GAS_WEB_APP_URL) {
        alert("Configuration Error: GAS_WEB_APP_URL is not defined in config.js");
        return;
      }

      const cards = document.querySelectorAll('.tc-card');
      if (cards.length === 0) {
        alert("Please add at least one test case.");
        return;
      }

      btn.disabled = true;
      statusMsg.className = "text-center text-xs mt-2 font-semibold text-blue-600";

      const dept = document.getElementById('department').value;
      const empId = document.getElementById('employeeId').value || "NoID";
      const solId = document.getElementById('solUserId').value;

      try {
        const totalCards = cards.length;

        for (let i = 0; i < totalCards; i++) {
          const card = cards[i];
          const tcId = card.getAttribute('data-tc-id');
          const fullCaseId = card.querySelector('.full-case-id').value;
          const result = card.querySelector('.tc-result').value;
          const situation = card.querySelector('.tc-situation').value;
          const expected = card.querySelector('.tc-expected').value;
          const files = tcFilesStore[tcId] || [];

          const progressPercent = ((i) / totalCards) * 100;
          showLoadingModal(`Uploading Case ${i + 1} of ${totalCards} (${fullCaseId})...`, progressPercent);

          const preparedFiles = [];
          for (let fIdx = 0; fIdx < files.length; fIdx++) {
            const file = files[fIdx];
            const fileData = await fileToBase64(file);
            const ext = file.name.substring(file.name.lastIndexOf("."));
            const targetFileName = `${fullCaseId}_${empId}_${fIdx + 1}${ext}`;

            preparedFiles.push({
              fileName: targetFileName,
              fileMimeType: file.type,
              fileData: fileData
            });
          }

          const payload = {
            department: dept,
            employeeId: empId,
            solUserId: solId,
            caseId: fullCaseId,
            testResult: result,
            situation: situation,
            expectedResult: expected,
            files: preparedFiles
          };

          await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        showLoadingModal(`Finalizing upload...`, 100);
        await new Promise(r => setTimeout(r, 500));

        saveCurrentProfileToQuickList();

        statusMsg.className = "text-center text-xs mt-2 font-semibold text-green-600";
        statusMsg.innerText = `✅ All cases & images submitted successfully!`;

        document.getElementById('testCasesContainer').innerHTML = "";
        tcCount = 0;
        Object.keys(tcFilesStore).forEach(k => delete tcFilesStore[k]);
        addTestCase();

      } catch (err) {
        statusMsg.className = "text-center text-xs mt-2 font-semibold text-red-600";
        statusMsg.innerText = "❌ Upload Failed (Gagal): " + err.toString();
      } finally {
        hideLoadingModal();
        validateFormState();
        btn.innerHTML = 'Submit All Cases <span class="font-normal text-xs">(Kirim Semua)</span>';
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Proof Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 max-w-md mx-auto">
  <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
    <h2 class="text-xl font-bold text-gray-800 border-b pb-2">SOL QA Proof Upload</h2>
    
    <!-- 프로필 섹션 (자동 저장) -->
    <div class="space-y-3 bg-blue-50 p-3 rounded-lg">
      <p class="text-xs font-semibold text-blue-600">👤 고정 사용자 프로필 (자동 유지)</p>
      <div>
        <label class="text-xs text-gray-600">Department</label>
        <select id="department" class="w-full p-2 border rounded text-sm bg-white">
          <option value="E-banking">E-banking</option>
          <option value="OCI">OCI</option>
          <option value="Retail">Retail</option>
          <option value="INTERNATIONAL">INTERNATIONAL</option>
          <option value="Cyber">Cyber</option>
          <option value="SPD">SPD</option>
          <option value="IT">IT</option>
          <option value="etc">etc</option>
        </select>
      </div>
      <div class="flex gap-2">
        <div class="w-1/2">
          <label class="text-xs text-gray-600">Employee ID</label>
          <input type="text" id="employeeId" placeholder="21100306" class="w-full p-2 border rounded text-sm">
        </div>
        <div class="w-1/2">
          <label class="text-xs text-gray-600">SOL USER ID</label>
          <input type="text" id="solUserId" placeholder="IDSOLTEST103" class="w-full p-2 border rounded text-sm">
        </div>
      </div>
    </div>

    <!-- 제출 가변 섹션 -->
    <div class="space-y-3">
      <div>
        <label class="text-xs font-bold text-gray-700">Case ID *</label>
        <input type="text" id="caseId" placeholder="id_iq_300_01_tc01" class="w-full p-2 border-2 border-indigo-400 rounded text-sm uppercase">
      </div>
      <div>
        <label class="text-xs font-bold text-gray-700">Test Result</label>
        <select id="testResult" onchange="toggleConditionalFields()" class="w-full p-2 border rounded text-sm">
          <option value="Pass">Pass</option>
          <option value="Fail">Fail</option>
          <option value="Improvement">Improvement</option>
        </select>
      </div>

      <!-- 조건부 동적 입력 창 (Fail / Improvement 선택 시 노출) -->
      <div id="conditionalFields" class="space-y-3 hidden border-l-4 border-amber-400 pl-3 py-1 bg-amber-50 rounded-r">
        <div>
          <label class="text-xs font-bold text-amber-800">Situation (상황 설명)</label>
          <textarea id="situation" rows="2" placeholder="발생한 문제 상황을 입력하세요" class="w-full p-2 border rounded text-sm"></textarea>
        </div>
        <div>
          <label class="text-xs font-bold text-amber-800">Expected Result (예상 결과)</label>
          <textarea id="expectedResult" rows="2" placeholder="정상 동작 시 기대 결과를 입력하세요" class="w-full p-2 border rounded text-sm"></textarea>
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-gray-700">Test Proof Image *</label>
        <input type="file" id="proofFile" accept="image/*" class="w-full text-xs text-gray-500 file:mr-2 file:py-2 file:px-4 file:rounded file:border-0 file:bg-indigo-50 file:text-indigo-700">
      </div>
    </div>

    <button id="submitBtn" onclick="handleSubmit()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg shadow hover:bg-indigo-700 active:scale-95 transition">
      증적 제출 및 다음 작성
    </button>
    <p id="statusMsg" class="text-center text-xs mt-2 font-semibold"></p>
  </div>

  <script>
    // ⚠️ 1단계에서 배포한 Google Apps Script Web App URL 입력
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzkkAglI4rdZjDOSItl9zSw90AbkgJRmlErVsgSO1iZ4j7qngGSXSeVI2p4I9sMe54caw/exec";

    window.onload = () => {
      if (localStorage.getItem('qa_dept')) document.getElementById('department').value = localStorage.getItem('qa_dept');
      if (localStorage.getItem('qa_empId')) document.getElementById('employeeId').value = localStorage.getItem('qa_empId');
      if (localStorage.getItem('qa_solId')) document.getElementById('solUserId').value = localStorage.getItem('qa_solId');
      toggleConditionalFields();
    };

    ['department', 'employeeId', 'solUserId'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => {
        localStorage.setItem('qa_dept', document.getElementById('department').value);
        localStorage.setItem('qa_empId', document.getElementById('employeeId').value);
        localStorage.setItem('qa_solId', document.getElementById('solUserId').value);
      });
    });

    // Test Result 값에 따라 상황/예상결과 입력창 동적 제어
    function toggleConditionalFields() {
      const result = document.getElementById('testResult').value;
      const condDiv = document.getElementById('conditionalFields');
      if (result === 'Fail' || result === 'Improvement') {
        condDiv.classList.remove('hidden');
      } else {
        condDiv.classList.add('hidden');
        document.getElementById('situation').value = "";
        document.getElementById('expectedResult').value = "";
      }
    }

    async function handleSubmit() {
      const caseIdInput = document.getElementById('caseId');
      const fileInput = document.getElementById('proofFile');
      const statusMsg = document.getElementById('statusMsg');
      const btn = document.getElementById('submitBtn');

      if (!caseIdInput.value.trim() || fileInput.files.length === 0) {
        alert("Case ID와 증적 이미지를 모두 입력해 주세요.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "업로드 중...";
      statusMsg.innerText = "";

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(e) {
        const payload = {
          department: document.getElementById('department').value,
          employeeId: document.getElementById('employeeId').value,
          solUserId: document.getElementById('solUserId').value,
          caseId: caseIdInput.value.trim(),
          testResult: document.getElementById('testResult').value,
          situation: document.getElementById('situation').value,
          expectedResult: document.getElementById('expectedResult').value,
          fileName: file.name,
          fileMimeType: file.type,
          fileData: e.target.result
        };

        try {
          await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          statusMsg.className = "text-center text-xs mt-2 font-semibold text-green-600";
          statusMsg.innerText = `✅ ${caseIdInput.value.toUpperCase()} 제출 완료!`;

          // 초기화 (프로필 유지, 가변값 비우기)
          caseIdInput.value = "";
          fileInput.value = "";
          document.getElementById('testResult').value = "Pass";
          toggleConditionalFields();
          caseIdInput.focus();

        } catch (err) {
          statusMsg.className = "text-center text-xs mt-2 font-semibold text-red-600";
          statusMsg.innerText = "❌ 업로드 실패: " + err.toString();
        } finally {
          btn.disabled = false;
          btn.innerText = "증적 제출 및 다음 작성";
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
